<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virgo Scout — Criar conta</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="cadastro.css">
</head>
<body class="login-page">

<div class="sky" aria-hidden="true">
  <video class="login-video" src="assets/videos/black-hole-first-pulse.mp4" poster="assets/black-hole.jpg" muted loop playsinline preload="metadata" autoplay></video>
  <i class="veil"></i>
</div>

<main class="login-wrap">
  <section class="login-card" aria-labelledby="cadTitle">
    <div class="login-pill"><span class="pill-dot"></span> Ambiente Seguro · Virgo Scout</div>
    <div class="login-brand">
      <img src="assets/LOGO.png" alt="" class="login-logo">
      <div>
        <h1 id="cadTitle">Criar conta</h1>
        <p>Solicitação sujeita à aprovação do administrador</p>
      </div>
    </div>

    <form id="cadForm" novalidate>
      <label class="field" for="cadName">
        <span>Nome completo</span>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input id="cadName" name="name" type="text" autocomplete="name" placeholder="Nome e sobrenome" required>
        </div>
      </label>

      <label class="field" for="cadEmail">
        <span>E-mail</span>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input id="cadEmail" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required>
        </div>
      </label>

      <div class="cad-grid">
        <label class="field" for="cadPhone">
          <span>Telefone / WhatsApp</span>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-11.7-5.9A19.8 19.8 0 0 1 2.2 4.2 2 2 0 0 1 4.1 2h2.9a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6.2 6.2l1.2-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2z"/></svg>
            <input id="cadPhone" name="phone" type="tel" autocomplete="tel" placeholder="(61) 99999-9999" required>
          </div>
        </label>
        <label class="field" for="cadCpf">
          <span>CPF</span>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h4M7 13h10M7 17h6"/></svg>
            <input id="cadCpf" name="cpf" type="text" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required>
          </div>
        </label>
      </div>

      <label class="field" for="cadPass">
        <span>Senha</span>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="cadPass" name="pass" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required>
        </div>
      </label>

      <label class="field" for="cadPass2">
        <span>Confirmar senha</span>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="m9 15 2 2 4-4"/></svg>
          <input id="cadPass2" name="pass2" type="password" autocomplete="new-password" placeholder="Repita a senha" required>
        </div>
      </label>

      <label class="check cad-consent"><input type="checkbox" id="cadConsent"><i></i> Autorizo o uso dos meus dados para contato</label>

      <p class="login-err" id="cadErr" role="alert" hidden></p>

      <button class="login-btn" id="cadSubmit" type="submit">
        <span>Enviar cadastro</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
      </button>
    </form>

    <div class="cad-ok" id="cadOk" hidden role="status" aria-live="polite" tabindex="-1">
      <span class="cad-ok-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      <strong>Cadastro enviado!</strong>
      <p>Aguarde a aprovação do administrador.</p>
    </div>

    <footer class="login-foot">
      <a href="/login" class="cad-back">← Voltar para o login</a>
      <span>Virgo Tech <span>v1.0.0</span></span>
    </footer>
  </section>
</main>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="vendor/gsap.min.js"></script>
<script src="cadastro.js"></script>
</body>
</html>
